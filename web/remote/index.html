<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#183249">
	<title>Pi Speak Remote</title>
	<link rel="manifest" href="/app/app.webmanifest">
	<style>
		:root {
			--primary: #183249;
			--on-primary: #f7fafc;
			--primary-container: #dceaf3;
			--on-primary-container: #102332;
			--accent: #c95532;
			--on-accent: #fff8f2;
			--success: #17765d;
			--warning: #a86d12;
			--danger: #b3261e;
			--bg: #fbfcf8;
			--panel: #f1f4ef;
			--raised: #ffffff;
			--ink: #17211c;
			--muted: #738078;
			--line: #ccd4cd;
			--outline: #8b978f;
			--bubble-user: #183249;
			--bubble-agent: #ffffff;
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			min-height: 100%;
			background: var(--bg);
			color: var(--ink);
		}

		body {
			font-family: Roboto, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}

		button, input, textarea, select {
			font: inherit;
		}

		.app {
			width: min(100%, 860px);
			min-height: 100dvh;
			margin: 0 auto;
			display: grid;
			grid-template-rows: auto 1fr auto;
			gap: 8px;
			padding: 8px;
		}

		.topbar,
		.chat,
		.composer,
		.voice-dock,
		.settings {
			background: var(--raised);
			border: 1px solid var(--line);
			border-radius: 8px;
		}

		.topbar {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 8px;
			align-items: center;
			padding: 8px;
			min-height: 64px;
		}

		.route-row {
			display: grid;
			grid-template-columns: minmax(120px, 1fr) auto;
			gap: 8px;
			align-items: center;
		}

		.route-label {
			display: grid;
			gap: 4px;
			min-width: 0;
		}

		.route-label span {
			font-size: 12px;
			color: var(--muted);
		}

		select,
		input[type="password"],
		input[type="text"],
		textarea {
			width: 100%;
			border: 1px solid var(--line);
			border-radius: 16px;
			background: var(--raised);
			color: var(--ink);
			outline: none;
		}

		select,
		input[type="password"],
		input[type="text"] {
			height: 48px;
			padding: 0 12px;
		}

		button {
			min-height: 48px;
			border: 1px solid transparent;
			border-radius: 16px;
			padding: 0 16px;
			background: var(--primary);
			color: var(--on-primary);
			cursor: pointer;
			font-size: 13px;
			font-weight: 650;
		}

		button.secondary {
			background: var(--panel);
			color: var(--primary);
			border-color: var(--line);
		}

		button:disabled {
			cursor: wait;
			opacity: 0.65;
		}

		.connection {
			display: flex;
			gap: 8px;
			align-items: center;
			justify-content: flex-end;
			color: var(--muted);
			font-size: 13px;
			white-space: nowrap;
		}

		.status-dot {
			width: 9px;
			height: 9px;
			border-radius: 999px;
			background: var(--muted);
		}

		.status-dot.ready { background: var(--success); }
		.status-dot.error { background: var(--danger); }

		.chat {
			min-height: 0;
			display: grid;
			grid-template-rows: 1fr auto;
			overflow: hidden;
		}

		.messages {
			min-height: 320px;
			overflow: auto;
			padding: 14px;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.message {
			max-width: min(78%, 620px);
			padding: 12px;
			border-radius: 8px;
			line-height: 1.5;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		.message.user {
			align-self: flex-end;
			background: var(--bubble-user);
			color: var(--on-primary);
		}

		.message.agent,
		.message.system {
			align-self: flex-start;
			background: var(--bubble-agent);
			border: 1px solid var(--line);
		}

		.message.system {
			color: var(--muted);
			font-size: 13px;
		}

		.audio-row {
			padding: 0 14px 14px;
			display: grid;
			gap: 8px;
		}

		audio {
			width: 100%;
			border-radius: 999px;
		}

		.status-note {
			color: var(--muted);
			font-size: 13px;
			min-height: 18px;
		}

		.composer {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 8px;
			padding: 8px;
		}

		textarea {
			min-height: 52px;
			max-height: 180px;
			resize: vertical;
			padding: 12px;
		}

		.voice-dock {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 8px;
			align-items: center;
			padding: 8px;
		}

		.talk-button {
			min-width: 128px;
			height: 64px;
			background: var(--accent);
			color: var(--on-accent);
			border-radius: 28px;
			font-weight: 700;
		}

		.talk-button.recording {
			background: var(--danger);
		}

		.voice-mode {
			display: flex;
			gap: 10px;
			align-items: center;
			min-width: 0;
		}

		.voice-mode input {
			width: 18px;
			height: 18px;
			accent-color: var(--accent);
		}

		.voice-copy {
			min-width: 0;
			display: grid;
			gap: 2px;
		}

		.voice-copy strong,
		.voice-copy span {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.voice-copy span,
		.timer {
			color: var(--muted);
			font-size: 13px;
		}

		details.settings {
			box-shadow: none;
		}

		details.settings summary {
			cursor: pointer;
			list-style: none;
			padding: 12px 16px;
			font-weight: 700;
		}

		details.settings summary::-webkit-details-marker {
			display: none;
		}

		.settings-body {
			border-top: 1px solid var(--line);
			padding: 16px;
			display: grid;
			gap: 12px;
		}

		.field-grid {
			display: grid;
			gap: 6px;
		}

		.text-actions,
		.quick-grid {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		label.toggle {
			display: flex;
			gap: 8px;
			align-items: center;
			color: var(--muted);
		}

		.hidden {
			display: none !important;
		}

		.legacy-output {
			display: none;
		}

		@media (max-width: 620px) {
			.app {
				padding: 8px;
				gap: 8px;
			}

			.topbar {
				grid-template-columns: 1fr;
			}

			.connection {
				justify-content: flex-start;
			}

			.messages {
				min-height: 300px;
				padding: 10px;
			}

			.message {
				max-width: 90%;
			}

			.composer {
				grid-template-columns: 1fr;
			}

			.voice-dock {
				grid-template-columns: 1fr;
			}

			.talk-button {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<div class="app">
		<header class="topbar">
			<div class="route-row">
				<label class="route-label">
					<span>Location / session</span>
					<select id="target-select">
						<option value="">Current session</option>
					</select>
				</label>
				<button id="refresh-button" class="secondary" type="button">Refresh</button>
			</div>
			<div class="connection">
				<span id="status-dot" class="status-dot"></span>
				<span id="auth-pill">Checking</span>
				<button id="install-button" class="secondary hidden" type="button">Install</button>
			</div>
		</header>

		<main class="chat" aria-live="polite">
			<div id="chat-messages" class="messages">
				<div class="message system">Ready when the gateway is connected.</div>
			</div>
			<div class="audio-row">
				<div id="status-note" class="status-note">Connecting...</div>
				<audio id="reply-audio" controls preload="none" class="hidden"></audio>
				<div id="audio-note" class="status-note">Audio replies are off unless conversation mode is enabled.</div>
			</div>
		</main>

		<section class="composer">
			<textarea id="text-input" placeholder="Message your agent..."></textarea>
			<button id="send-text-button" type="button">Send</button>
		</section>

		<section class="voice-dock">
			<label class="voice-mode">
				<input id="audio-toggle" type="checkbox">
				<span class="voice-copy">
					<strong>Conversation mode</strong>
					<span id="record-subtitle">Text replies unless this is on</span>
				</span>
			</label>
			<button id="record-button" class="talk-button" type="button">
				<span id="record-label">Talk</span>
			</button>
			<div id="timer" class="timer">Ready</div>
		</section>

		<details class="settings" id="settings-panel">
			<summary>Settings</summary>
			<div class="settings-body">
				<label class="field-grid">
					<span>Manual session target</span>
					<input id="target-input" type="text" placeholder="Optional route name">
				</label>
				<div class="text-actions">
					<button id="save-target-button" class="secondary" type="button">Set target</button>
					<button id="clear-target-button" class="secondary" type="button">Use current</button>
				</div>
				<label class="field-grid">
					<span>API token</span>
					<input id="token-input" type="password" placeholder="Remote token">
				</label>
				<label class="field-grid">
					<span>Launch path</span>
					<input id="launch-path-input" type="text" placeholder="Optional working directory">
				</label>
				<div class="text-actions">
					<button id="save-token-button" class="secondary" type="button">Save settings</button>
					<button id="clear-token-button" class="secondary" type="button">Forget token</button>
					<button id="clear-text-button" class="secondary" type="button">Clear draft</button>
				</div>
				<label class="toggle">
					<input id="remember-token-toggle" type="checkbox">
					<span>Remember this device</span>
				</label>
				<label class="toggle">
					<input id="autoplay-toggle" type="checkbox" checked>
					<span>Autoplay reply audio</span>
				</label>
				<div class="quick-grid">
					<button type="button" data-action="mono/on">Mono on</button>
					<button type="button" data-action="mono/off" class="secondary">Mono off</button>
					<button type="button" data-action="speak/on">Speak on</button>
					<button type="button" data-action="speak/off" class="secondary">Speak off</button>
				</div>
				<div class="legacy-output">
					<span id="origin-pill"></span>
					<span id="secure-pill"></span>
					<span id="transcript-output"></span>
					<span id="reply-output"></span>
				</div>
			</div>
		</details>
	</div>

	<script type="module" src="/app/app.js"></script>
</body>
</html>
