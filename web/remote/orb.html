<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#0a0b10">
	<title>Pi Speak Live</title>
	<link rel="stylesheet" href="/orb/orb.css">
</head>
<body class="booting">
	<div class="stage" id="stage">
		<header class="top">
			<div class="identity">
				<strong>Pi Speak Live</strong>
				<span class="sub" id="backend-label">Gemini Live</span>
			</div>
			<div class="top-actions">
				<button type="button" class="icon-btn" id="mute-btn" title="Mute mic" aria-label="Mute microphone">Mic</button>
				<button type="button" class="icon-btn" id="cam-btn" title="Camera tool" aria-label="Toggle camera">Cam</button>
				<button type="button" class="icon-btn" id="close-btn" title="Close" aria-label="Close orb">×</button>
			</div>
		</header>

		<main class="hero">
			<button type="button" class="orb state-idle" id="orb" aria-label="Start or stop live conversation">
				<span class="orb-core"></span>
				<span class="orb-ring"></span>
			</button>
			<p class="caption" id="caption">Tap the orb to talk</p>
			<p class="subcaption" id="subcaption">Desktop companion for terminal voice</p>
		</main>

		<aside class="chat" id="chat" aria-live="polite"></aside>
		<form class="composer" id="composer" aria-label="Send a message">
			<label class="composer-label" for="composer-input">Message</label>
			<textarea id="composer-input" name="message" rows="1" placeholder="Type a message" disabled></textarea>
			<button type="submit" class="btn composer-send" id="composer-send" disabled>Send</button>
		</form>
		<div id="approvals" class="approvals" aria-live="polite"></div>

		<!-- Speech-mode panel: shown only when ?mode=speech. Distinct from the
		     realtime Live flow — no /v1/live connect, no mic/cam, audio is the
		     staged artifact controlled by the operator. -->
		<section class="speech-panel hidden" id="speech-panel" aria-live="polite">
			<h2 class="speech-title">Pi Speak Reply</h2>
			<pre class="speech-text" id="speech-text">Loading…</pre>
			<audio id="speech-audio" controls preload="metadata" aria-label="Reply audio"></audio>
			<div class="speech-actions">
				<button type="button" class="btn" id="speech-stop-btn">Stop</button>
				<button type="button" class="btn" id="speech-disable-btn">Disable speech</button>
				<button type="button" class="btn" id="speech-enable-btn" hidden>Re-enable speech</button>
			</div>
			<p class="speech-status" id="speech-status">Audio is staged. Press play when ready.</p>
		</section>

		<footer class="dock">
			<div class="gate">
				<label for="gate-db">Gate <span id="gate-value">-50 dB</span></label>
				<input id="gate-db" type="range" min="-66" max="-3" step="1" value="-50">
			</div>
			<div class="meter"><div class="meter-fill" id="meter-fill"></div></div>
			<button type="button" class="btn hidden" id="replay-btn" aria-label="Replay interrupted assistant audio">Replay</button>
			<button type="button" class="btn" id="cascade-btn" aria-pressed="false" title="Cascade mode: push-to-talk mic goes through STT into a text turn, replies are spoken via server TTS instead of live audio">Cascade</button>
			<button type="button" class="btn" id="stop-btn" disabled>End</button>
		</footer>

		<video id="cam-pip" class="cam-pip hidden" playsinline muted autoplay></video>
	</div>
	<script type="module" src="/orb/orb.js"></script>
</body>
</html>
