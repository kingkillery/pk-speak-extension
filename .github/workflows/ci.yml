name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run typecheck
      - name: Test suite (parallel + stress + coverage)
        run: npm run verify
      - name: Realtime-live integration suite
        run: npm run test:realtime-live
